[project]
name = "portal_branding"
authors = [
    { name = "Animus Digital", email = "jon@animusdigital.co" },
]
description = "Rebrand the Frappe/ERPNext web portal with your own colors, logo, and fonts. No CSS required."
requires-python = ">=3.10"
readme = "README.md"
license = { file = "license.txt" }
dynamic = ["version"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
